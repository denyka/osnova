---
name: watch

# Daily (SPEC 9): dispatch a release when an upstream base moved since the
# latest release or a fixable HIGH or CRITICAL finding appeared in a
# published image. Never commits, never publishes. Silence is never "no
# drift": an unresolvable base, an unscannable image or a record that does
# not verify fails the run.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

# Two watches at once could dispatch two releases; one runs at a time, none cancelled.
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/denyka/osnova
  # The identity the release record is signed with (SPEC 8.5).
  COSIGN_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_IDENTITY: '^https://github\.com/denyka/osnova/\.github/workflows/release\.yml@refs/heads/main$'

jobs:
  # Reads only: the signed record, the live bases, the published images.
  scan:
    name: drift and fixable findings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      # Read access to the published images, whether or not they are public yet.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Version and sha256 from the tree (SPEC 8.9); only the tarball is downloaded.
      - name: Install Trivy (pinned, sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          . .github/trivy.sha256
          [[ "$(uname -m)" == x86_64 ]] || { printf 'the watch runs on linux/amd64\n' >&2; exit 1; }
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$(mktemp -d)"
          curl -fsSLO --proto '=https' \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          printf '%s  %s\n' "${TRIVY_SHA256_AMD64}" "${tarball}" | sha256sum --check --strict -
          tar -xzf "${tarball}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Compare the latest release's record with the live bases
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          reason=""
          # No release at all is the one absence that is a reason; any other failure fails.
          if latest="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>err.txt)"; then
            have_record=true
          elif grep -q 'HTTP 404' err.txt; then
            have_record=false
          else
            cat err.txt
            printf '::error::cannot read the latest release\n'
            exit 1
          fi
          if [[ "${have_record}" == false ]]; then
            reason="no release yet"
          else
            # The record is trusted only once its signature verifies (SPEC 8.4).
            gh release download "${latest}" --repo "${REPO}" --pattern record.json --pattern record.json.sigstore.json
            [[ -f record.json ]] ||
              { printf '::error::the latest release %s has no record.json\n' "${latest}"; exit 1; }
            [[ -f record.json.sigstore.json ]] ||
              { printf '::error::the latest release %s has no record.json.sigstore.json\n' "${latest}"; exit 1; }
            cosign verify-blob --certificate-oidc-issuer "${COSIGN_ISSUER}" \
              --certificate-identity-regexp "${COSIGN_IDENTITY}" \
              --bundle record.json.sigstore.json record.json
            bash tools/resolve_bases.sh --json > live.json
            jq -e 'length > 0 and all(.[]; [.platforms["linux/amd64"], .platforms["linux/arm64"]]
              | all(type == "string" and test("^sha256:[0-9a-f]{64}$")))' live.json >/dev/null ||
              { printf '::error::the resolver gave no per-architecture digests\n'; exit 1; }
            # Drift is per architecture (SPEC 9): the index digest alone moves when an
            # architecture the project does not build is republished.
            drift="$(jq -r --slurpfile rec record.json '
              ($rec[0].images | map({(.name): .}) | add // {}) as $r
              | .[] | select($r[.name] != null) | .name as $n | .platforms as $live
              | select(any("linux/amd64", "linux/arm64"; . as $p | $live[$p] != $r[$n].base_platforms[$p]))
              | $n' live.json)"
            missing="$(jq -r --slurpfile rec record.json '
              .[] | select([.name] - ($rec[0].images | map(.name)) | length > 0) | .name' live.json)"
            [[ -n "${drift}" ]] && reason="base moved: $(printf '%s' "${drift}" | paste -sd, -)"
            [[ -n "${missing}" ]] && reason="${reason:+${reason}; }not in the latest release: $(
              printf '%s' "${missing}" | paste -sd, -)"
          fi
          # Only the images the latest release published are scanned; with no
          # release yet there is nothing to scan and the reason is already set.
          # Trivy exits 1 on fatal errors too, so a finding is exit code 3.
          vuln=""
          if [[ "${have_record}" == true ]]; then
            names="$(jq -r '.images[].name' record.json)"
            [[ -n "${names}" ]] || { printf '::error::the record lists no images\n'; exit 1; }
            while read -r name; do
              found=false
              for platform in linux/amd64 linux/arm64; do
                rc=0
                trivy image --platform "${platform}" --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
                  --exit-code 3 --quiet "${REGISTRY}/${name}:latest" || rc=$?
                case "${rc}" in
                  0) ;;
                  3) found=true ;;
                  *) printf '::error::cannot scan %s (%s)\n' "${name}" "${platform}"; exit 1 ;;
                esac
              done
              [[ "${found}" == false ]] || vuln="${vuln:+${vuln},}${name}"
            done <<<"${names}"
          fi
          [[ -n "${vuln}" ]] && reason="${reason:+${reason}; }fixable findings: ${vuln}"
          printf 'reason=%s\n' "${reason}" >> "${GITHUB_OUTPUT}"
          printf 'watch: %s\n' "${reason:-nothing to do}"

  # The one job with actions: write. Runs after every scan, failed or not, so
  # the schedules are re-enabled on every run (SPEC 4.2); dispatches only on a
  # reason from a scan that succeeded.
  dispatch:
    name: re-enable the schedules and dispatch
    needs: [scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Re-enable the scheduled workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow enable release.yml --repo "${REPO}"
          gh workflow enable watch.yml --repo "${REPO}"

      # Not when today's release exists (the same-day guard would refuse it,
      # SPEC 8.2) or a release run is queued or in progress (it picks up
      # whatever the watch saw).
      - name: Dispatch a release
        if: needs.scan.result == 'success' && needs.scan.outputs.reason != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REASON: ${{ needs.scan.outputs.reason }}
        run: |
          set -euo pipefail
          today="v$(date -u +%Y.%m.%d)"
          if gh release view "${today}" --repo "${REPO}" >/dev/null 2>err.txt; then
            printf "today's release %s exists; not dispatching (%s)\n" "${today}" "${REASON}"
            exit 0
          elif ! grep -qi 'release not found' err.txt; then
            cat err.txt
            printf '::error::cannot read the release %s\n' "${today}"
            exit 1
          fi
          for status in in_progress queued; do
            runs="$(gh run list --repo "${REPO}" --workflow release.yml --status "${status}" \
              --json databaseId --jq 'length')"
            if [[ "${runs}" != 0 ]]; then
              printf 'a release run is %s; not dispatching (%s)\n' "${status}" "${REASON}"
              exit 0
            fi
          done
          printf 'dispatching release.yml: %s\n' "${REASON}"
          gh workflow run release.yml --repo "${REPO}" --ref main
